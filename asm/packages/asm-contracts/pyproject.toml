[project]
name = "asm-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for asm-core."
requires-python = ">=3.12"
dependencies = ["pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm_contracts"]
