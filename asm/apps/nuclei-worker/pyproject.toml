[project]
name = "asm-nuclei-worker"
version = "0.1.0"
description = "Hatchet worker hosting the nuclei scanner batch task."
requires-python = ">=3.12"
dependencies = [
    "asm-contracts",
    "asm-execution",
    "asm-logging",
    "hatchet-sdk>=1.41.1",
    "pydantic-settings>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm_nuclei_worker"]
