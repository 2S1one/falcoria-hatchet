[project]
name = "asm-httpx-worker"
version = "0.1.0"
description = "Hatchet worker hosting the httpx scanner task."
requires-python = ">=3.12"
dependencies = [
    "asm-contracts",
    "asm-logging",
    "hatchet-sdk>=1.41.1",
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm_httpx_worker"]
