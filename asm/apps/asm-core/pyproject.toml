[project]
name = "asm-core"
version = "0.1.0"
description = "Hatchet worker hosting the httpx-then-nuclei chain."
requires-python = ">=3.12"
dependencies = [
    "asm-contracts",
    "asm-logging",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "hatchet-sdk>=1.41.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asm_core"]
