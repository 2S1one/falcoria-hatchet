---
- name: Gather the installed packages
  ansible.builtin.package_facts:
    manager: apt

# A machine that already runs Docker CE (a provider image) keeps its own repository setup.
- name: Install Docker from the official repository
  when: "'docker-ce' not in ansible_facts.packages"
  block:
    - name: Remove unofficial Docker packages
      ansible.builtin.apt:
        name: "{{ docker_conflicting_packages }}"
        state: absent

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_keyring_path }}"
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_apt_architectures[ansible_facts['architecture']] }}"
        signed_by: "{{ docker_keyring_path }}"
        state: present

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Enable and start the Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
