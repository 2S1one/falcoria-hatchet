---
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_architectures:
  x86_64: amd64
  aarch64: arm64
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
