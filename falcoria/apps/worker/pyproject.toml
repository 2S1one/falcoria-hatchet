[project]
name = "falcoria-worker"
version = "0.1.0"
description = "Falcoria scan runners — nmap scanner and report uploader, Hatchet workers."
requires-python = ">=3.12"
dependencies = [
    "falcoria-contracts",
    "falcoria-http",
    "falcoria-logging",
    "hatchet-sdk>=1.41.1",
    "httpx",
    "pydantic-settings",
    "defusedxml>=0.7.1",
]

[project.scripts]
falcoria-scanner = "falcoria_worker.main:scanner"
falcoria-uploader = "falcoria_worker.main:uploader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcoria_worker"]
